[package]
name = "herdr-shield"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Keep default-shell Herdr panes alive across server crashes"
autotests = false

[dependencies]
alacritty_terminal = "=0.26.0"
base64 = "=0.22.1"
nix = { version = "=0.31.3", features = ["term", "signal", "process", "socket", "user", "fs", "poll"] }
portable-pty = "=0.9.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }
toml = "=0.9.8"

[[test]]
name = "process"
path = "tests/holder/process.rs"

[profile.release]
lto = "thin"
strip = true
